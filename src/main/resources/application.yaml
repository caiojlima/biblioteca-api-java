spring:
  application:
    name: biblioteca-api

  jackson:
    serialization:
      write-dates-as-timestamps: false

  data:
    mongodb:
      uri: mongodb://localhost:27017/biblioteca
      auto-index-creation: true

    redis:
      host: localhost
      port: 6379

biblioteca:
  cache:
    prefixo: "biblioteca:"
    ttl: 10m